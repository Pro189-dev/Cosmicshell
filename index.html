<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CosmicShell v1.0</title>
  
  <!-- Google Fonts: Audiowide & Bytesized -->
  <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Bytesized&display=swap" rel="stylesheet">
  
  <!-- Main Stylesheet Connection -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 1. GRAPHICAL OS BOOT SCREEN -->
  <div id="boot-screen">
    <div class="boot-content">
      <img src="assets/avatar.png" alt="OS Logo" class="boot-logo">
      <h2 class="boot-title">COSMICSHELL</h2>
      <div class="loading-bar-container">
        <div class="loading-bar"></div>
      </div>
      <p class="boot-status">Loading system assets...</p>
    </div>
  </div>

  <!-- 2. LOCK SCREEN OVERLAY -->
  <div id="lock-screen" class="hidden">
    
    <!-- Top Clock & Date -->
    <div class="lock-top">
      <div id="lock-clock">00:00 PM</div>
      <div id="lock-date">DAY, MONTH 00</div>
    </div>

    <!-- Login Box Panel (Password-Free) -->
    <div class="login-box">
      <div class="login-left">
        <img src="assets/avatar.png" alt="User Avatar" class="user-avatar">
      </div>
      <div class="login-right">
        <div class="username">CAPTAIN</div>
        <div class="status-msg" id="login-status">System Standby</div>
        <div class="login-buttons">
          <button id="unlock-btn" class="pixel-btn primary" onclick="triggerUnlock()">[ ENTER SYSTEM ]</button>
        </div>
      </div>
    </div>

    <div class="lock-footer">COSMICSHELL v1.0 | Press [ENTER] to Unlock</div>
  </div>


  <!-- 3. DESKTOP & TASKBAR -->
  <div id="desktop">
    
    <!-- This area will hold your desktop icons later -->
    <div id="desktop-icons"></div>

    <!-- The Arcade Deck Taskbar -->
    <footer id="taskbar">
      <div class="taskbar-left">
        <!-- Ghost Start Button -->
        <button class="start-btn">
          <img src="assets/avatar.png" alt="Start" class="start-icon">
        </button>
        <!-- Open apps will appear here later -->
        <div id="active-apps"></div>
      </div>
      
      <div class="taskbar-right">
        <!-- Sunken System Clock -->
        <div id="clock" class="taskbar-clock">00:00 PM</div>
      </div>
    </footer>
    
  </div>

  <!-- Main JavaScript Connection -->
  <script src="script.js"></script>
</body>
</html>
